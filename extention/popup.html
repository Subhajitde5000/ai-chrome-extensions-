<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MCQ Auto Solver</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(166,227,161,0.5); }
      50%      { box-shadow: 0 0 0 5px rgba(166,227,161,0);  }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes slide-in {
      from { opacity:0; transform:translateY(4px); }
      to   { opacity:1; transform:translateY(0);   }
    }

    body {
      width: 260px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      animation: slide-in 0.2s ease both;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #313244 0%, #1e1e2e 100%);
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #313244;
    }
    .header-icon { font-size: 22px; line-height: 1; }
    .header-title { font-weight: 700; font-size: 14px; color: #89b4fa; }
    .header-sub   { font-size: 10px; color: #6c7086; margin-top: 1px; }

    /* ── AI Status card ── */
    .ai-card {
      margin: 12px 14px;
      background: #181825;
      border: 1.5px solid #313244;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ai-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-card-label {
      font-size: 10px;
      color: #6c7086;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #a6e3a1;
      animation: pulse-ring 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .live-dot.off  { background: #45475a; animation: none; }
    .live-dot.warn { background: #f9e2af; }
    .live-dot.err  { background: #f38ba8; animation: none; }
    .live-dot.purple { background: #cba6f7; animation: none; }

    .state-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .state-icon { font-size: 14px; line-height: 1; }
    .state-text {
      font-size: 12px;
      color: #cdd6f4;
      font-weight: 500;
    }
    .q-badge {
      background: #313244;
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 10px;
      color: #89b4fa;
      font-weight: 700;
      margin-left: auto;
    }

    .focus-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #6c7086;
      margin-top: 2px;
    }
    .focus-indicator {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #45475a;
      flex-shrink: 0;
    }
    .focus-indicator.focused { background: #89b4fa; }

    /* ── Toggle row ── */
    .section { padding: 0 14px 4px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #181825;
      border: 1.5px solid #313244;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .toggle-label { font-size: 12px; color: #cdd6f4; }

    .switch { position: relative; width: 38px; height: 20px; }
    .switch input { display: none; }
    .slider {
      position: absolute; inset: 0;
      background: #45475a;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #cdd6f4;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #89b4fa; }
    input:checked + .slider::before { transform: translateX(18px); }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 0 14px 10px;
    }
    .btn {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover   { opacity: 0.85; }
    .btn:active  { transform: scale(0.97); }
    .btn-primary   { background: #89b4fa; color: #1e1e2e; }
    .btn-secondary { background: #313244; color: #cdd6f4; border: 1px solid #45475a; }
    .btn:disabled  { opacity: 0.4; cursor: not-allowed; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #181825;
      padding: 7px 14px;
      font-size: 10px;
      color: #45475a;
      line-height: 1.5;
      text-align: center;
    }
    .footer code {
      background: #313244;
      border-radius: 3px;
      padding: 0 3px;
      color: #89b4fa;
      font-size: 10px;
    }

    .divider {
      border: none;
      border-top: 1px solid #313244;
      margin: 6px 14px 8px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <div class="header-title">MCQ Auto Solver</div>
      <div class="header-sub">AI-powered MCQ detection</div>
    </div>
  </div>

  <!-- AI Status Card -->
  <div class="ai-card">
    <div class="ai-card-row">
      <span class="ai-card-label">Extension Status</span>
      <span class="live-dot" id="live-dot"></span>
    </div>

    <div class="state-row">
      <span class="state-icon" id="state-icon">🤖</span>
      <span class="state-text" id="state-text">Loading…</span>
      <span class="q-badge" id="q-badge" style="display:none;"></span>
    </div>

    <div class="focus-row">
      <span class="focus-indicator" id="focus-indicator"></span>
      <span id="focus-text">Checking tab focus…</span>
    </div>
  </div>

  <!-- Toggle -->
  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">⚡ Auto Detect MCQs</span>
      <label class="switch">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary"   id="rescan-btn">🔍 Scan Now</button>
    <button class="btn btn-secondary" id="clear-btn">🗑 Hide</button>
  </div>

  <hr class="divider" />

  <!-- Footer -->
  <div class="footer">
    Answers hidden when tab not focused.<br/>
    Server: <code>127.0.0.1:5000</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
